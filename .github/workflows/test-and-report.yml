name: Playwright Multi-Platform Test & Allure Report

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    name: Run Multi-Platform Tests
    timeout-minutes: 45
    runs-on: windows-latest # Windows runner supports Desktop Electron, Web, and Mobile emulation

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java (Required for Allure CLI)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers & OS Dependencies
        run: npx playwright install --with-deps

      - name: Execute Web Tests
        run: npm run test:web
        continue-on-error: true

      - name: Execute Mobile Tests
        run: npm run test:mobile
        continue-on-error: true

      - name: Execute Desktop Electron Tests
        run: npm run test:desktop
        continue-on-error: true

      - name: Generate Allure Report
        run: npm run allure:generate

      - name: Upload Allure Results Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: allure-results
          retention-days: 20

      - name: Upload Allure Report HTML
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: allure-report
          retention-days: 30
