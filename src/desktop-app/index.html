<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Enterprise Desktop Assistant</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 30px;
      background: #f4f6f9;
      color: #333;
    }
    .card {
      background: #fff;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      max-width: 500px;
      margin: 0 auto;
    }
    h1 {
      margin-top: 0;
      color: #1e293b;
      font-size: 22px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }
    button {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      font-size: 14px;
    }
    button:hover {
      background-color: #1d4ed8;
    }
    #status-message {
      margin-top: 16px;
      padding: 12px;
      border-radius: 6px;
      font-weight: 500;
      display: none;
    }
    .status-success {
      background: #dcfce7;
      color: #166534;
      display: block !important;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="app-heading">Enterprise Desktop Assistant</h1>
    <p>Desktop client synchronized with Web and Mobile cloud accounts.</p>

    <div class="form-group">
      <label for="desktop-username">User ID / License Key</label>
      <input type="text" id="desktop-username" placeholder="Enter license key..." />
    </div>

    <div class="form-group">
      <label for="desktop-workspace">Workspace Name</label>
      <input type="text" id="desktop-workspace" placeholder="Enter workspace..." />
    </div>

    <button id="btn-desktop-connect" type="button">Connect Workspace</button>

    <div id="status-message" data-testid="status-message"></div>
  </div>

  <script>
    const btn = document.getElementById('btn-desktop-connect');
    const statusMsg = document.getElementById('status-message');
    const userInput = document.getElementById('desktop-username');
    const workspaceInput = document.getElementById('desktop-workspace');

    btn.addEventListener('click', () => {
      const user = userInput.value.trim();
      const ws = workspaceInput.value.trim();
      if (user && ws) {
        statusMsg.className = 'status-success';
        statusMsg.textContent = `Connected successfully to ${ws} as ${user}!`;
      } else {
        alert('Please provide both License Key and Workspace');
      }
    });
  </script>
</body>
</html>
